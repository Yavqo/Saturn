# Push a tag like v0.2.0 and this builds Saturn and publishes it as a GitHub release.
# Installed copies of Saturn then offer it as an update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # A release published from a Mac with scripts/release.sh already has its files; don't build over it.
      - name: Skip if the release already has files
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' 2>/dev/null | grep -qv '^0$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.skip != 'true'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSATURN_VERSION="$VERSION"
          cmake --build build -j4

      - name: Package
        if: steps.existing.outputs.skip != 'true'
        run: |
          mkdir -p dist/pkg
          cp -R build/saturn.app dist/pkg/Saturn.app
          codesign --force --deep -s - dist/pkg/Saturn.app
          codesign --verify --deep dist/pkg/Saturn.app
          ditto -c -k --sequesterRsrc --keepParent dist/pkg/Saturn.app "dist/Saturn-$VERSION.zip"
          brew install create-dmg || true
          python3 -m pip install --quiet --break-system-packages pillow || true
          scripts/make-dmg.sh dist/pkg/Saturn.app "dist/Saturn-$VERSION.dmg"

      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/Saturn-$VERSION.zip" "dist/Saturn-$VERSION.dmg" --title "Saturn $VERSION" --generate-notes $FLAGS
