<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Focus for YouTube</title>
<link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body>
  <h1>Focus for YouTube</h1>
  <label class="row"><span>Hide comments</span><input data-key="comments" class="switch" type="checkbox" role="switch"></label>
  <label class="row"><span>Hide recommended videos</span><input data-key="related" class="switch" type="checkbox" role="switch"></label>
  <label class="row"><span>Hide Shorts</span><input data-key="shorts" class="switch" type="checkbox" role="switch"></label>
</body></html>
